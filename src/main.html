<!-- DOCTYPE declaration for HTML5 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Character encoding for proper text rendering -->
  <meta charset="UTF-8">
  <!-- Viewport settings for responsive design on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Page title displayed in browser tab -->
  <title>Environmental Station</title>
  <!-- Link to external CSS stylesheet for styling -->
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <!-- Main container for the entire dashboard -->
  <div class="board">
    <!-- Sidebar navigation showing connected sensors -->
    <aside class="sidebar">
      <!-- Sensor block for temperature/humidity (AHT10) and pressure (BMP280) -->
      <div class="sensor-block">
        <span>AHT10<br>+ BMP280</span>
        <div class="arrow">&#9654;</div>
      </div>
      <!-- Sensor block for light intensity (BH1750) -->
      <div class="sensor-block">
        <span>BH1750</span>
        <div class="arrow">&#9654;</div>
      </div>
      <!-- Sensor block for maximum light reading -->
      <div class="sensor-block">
        <span>MAX<br><span id="maxLight">----</span></span>
        <div class="arrow">&#9654;</div>
      </div>
      <!-- Sensor block for air quality (MQ-135) -->
      <div class="sensor-block">
        <span>MQ-135<br><span id="airRaw">----</span></span>
        <div class="arrow">&#9654;</div>
      </div>
    </aside>

    <!-- Main content panel displaying sensor readings -->
    <main class="panel">
      <!-- Connection control section -->
      <div id="connectBar">
        <!-- Input field for ESP32 device IP address -->
        <label>ESP32 IP: <input type="text" id="espip" placeholder="192.168.1.50"> </label>
        <!-- Button to establish connection to ESP32 -->
        <button id="connectBtn">Connect</button>
        <!-- Status indicator dot (shows online/offline state) -->
        <span id="status" class="status-dot offline"></span>
      </div>

      <!-- Primary sensor readings displayed as headings -->
      <h1>Temperature: <span id="temperature">----</span>°C</h1>
      <h1>Humidity: <span id="humidity">----</span>%</h1>
      <h1>Pressure: <span id="pressure">----</span> hPa</h1>

      <!-- Secondary sensor readings in a row layout -->
      <div class="extra-row">
        <p>Light: <span id="light">----</span> lux</p>
        <p>Noise: <span id="noise">----</span> dB</p>
      </div>

      <!-- Canvas element for rendering data visualization chart -->
      <canvas id="chart" width="700" height="350"></canvas>
    </main>
  </div>
  
  <!-- Link to external JavaScript file for functionality and interactivity -->
  <script src="main.js"></script>
</body>
</html>
